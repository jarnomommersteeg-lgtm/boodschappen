<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mijn boodschappen</title>
<style>
:root{--bg:#f2f5f1;--ink:#17211b;--mut:#5d6b62;--card:#fff;--g:#2c6b4e;--gl:#dcebe2;--y:#f0c24b;--line:#d8e0da;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#121a15;--ink:#eaf1ec;--mut:#9db0a3;--card:#1a251e;--g:#58b588;--gl:#24372c;--line:#2e4034}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:84px}
h1{font:700 1.7rem Georgia,serif;margin:.2em 0 .6em}h2{font:700 1.15rem Georgia,serif;margin:1.4em 0 .5em}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:10px 0;color:var(--mut);text-decoration:none;font-size:.8rem}nav a b{display:block;font-size:1.4rem;font-weight:400}nav a.on{color:var(--g);font-weight:700}
main{max-width:860px;margin:auto;padding:60px 16px 16px}.top{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:6;gap:8px}.ic{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card .ph{aspect-ratio:4/3;background:var(--gl) center/cover;display:grid;place-items:center;font-size:2rem}
.card .t{padding:10px}.card small{color:var(--mut)}
button,.btn,select,input,textarea{font:inherit;color:inherit}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block}
button.s,.btn.s{background:var(--gl);color:var(--ink)}button.d{background:#b3372c}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{flex:1}.row .n{flex:0 0 84px}.row .u{flex:0 0 120px}.row .x{flex:0 0 44px;padding:0}
.fav{position:absolute;top:6px;right:6px;background:#fff9;color:#c0392b;padding:0;width:38px;min-height:38px;border-radius:50%;font-size:1.2rem}
.hero{width:100%;max-height:340px;object-fit:cover;border-radius:var(--r)}
.it{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-height:56px}
.it input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none}.it.done{opacity:.5;text-decoration:line-through}.it select{width:auto;flex:none;padding:4px;min-height:0;font-size:.8rem}.it span{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar>input,.bar>select{flex:1;min-width:140px}
ol.steps li{margin-bottom:.7em}table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}
.stp{display:inline-flex;align-items:center;gap:10px;background:var(--gl);border-radius:12px;padding:4px}.stp button{padding:0;width:44px}
.hist{display:block;color:inherit;text-decoration:none;padding:14px;margin-bottom:8px}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:200px;flex-direction:column;border:0;border-right:1px solid var(--line);padding-top:20px}nav a{text-align:left;padding:12px 22px;font-size:1rem}nav a b{display:inline;margin-right:8px;font-size:1.1rem}body{padding:0 0 0 200px}}
@media print{nav,.bar,.noprint,.top{display:none!important}body{padding:0;background:#fff;color:#000}.it{border:0;border-bottom:1px solid #ccc;border-radius:0}}
</style></head><body>
<div id=top class=top style="display:none"><button class=ic onclick="help()" title="Uitleg" style="border:1px solid var(--line);padding:0;cursor:pointer">?</button><a href="#/instellingen" class=ic title="Instellingen">⚙</a></div><nav id="nav"></nav><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === Vul hier jouw Supabase-gegevens in (Project Settings > API) ===
const SUPABASE_URL='https://lkoejzopkrabbdktfhyi.supabase.co', SUPABASE_KEY='sb_publishable_O8_N4k4WmpXnXQmec8n3-g_w2mnmjLJ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UNITS=['gram','kilogram','milliliter','liter','stuk','eetlepel','theelepel','snufje','verpakking'];
const SH={gram:'g',kilogram:'kg',milliliter:'ml',liter:'l',stuk:'stuk',eetlepel:'el',theelepel:'tl',snufje:'snufje',verpakking:'verpakking'};
const BASE={gram:['g',1],kilogram:['g',1000],milliliter:['ml',1],liter:['ml',1000],eetlepel:['ml',15],theelepel:['ml',5],stuk:['stuk',1],snufje:['snufje',1],verpakking:['verpakking',1]};
const COUNT=['stuk','snufje','verpakking'];
const AIS=['🥦 Groente & fruit','🥩 Vlees & vis','🥛 Zuivel','🥫 Houdbaar','Overig'];
const GUESS=[[/bouillon/,3],[/\bui\b|\buien\b|knoflook|paprika|tomaat|sla|wortel|aardappel|courgette|champignon|citroen|appel|banaan|spinazie|broccoli|komkommer|prei/,0],[/kip|gehakt|vlees|vis|zalm|spek|worst|biefstuk|garnaal|tonijn/,1],[/melk|zuivel|kaas|boter|room|yoghurt|ei(eren)?$|eieren|kwark/,2],[/pasta|spaghetti|rijst|blik|saus|bloem|suiker|olie|zout|peper|meel|bonen|bouillon|ketjap|soja/,3]];
const norm=n=>n.toLowerCase().trim().replace(/\s+/g,' ');
const aisleOf=(n,map)=>map[n]||AIS[(GUESS.find(g=>g[0].test(n))||[0,4])[1]];
const nl=n=>String(Math.round(n*10)/10).replace('.',',');
const fmtO=(q,u)=>(COUNT.includes(u)?nl(Math.ceil(q-1e-9)):nl(q))+' '+SH[u];
const fmtB=(q,b)=>b=='g'&&q>=1000?nl(q/1000)+' kg':b=='ml'&&q>=1000?nl(q/1000)+' l':(COUNT.includes(b)?nl(Math.ceil(q-1e-9)):nl(q))+' '+b;
const photo=p=>p?db.storage.from('recipe-photos').getPublicUrl(p).data.publicUrl:'';
const dt=d=>new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
const go=h=>location.hash=h;let user=null,R=null,photoFile=null,HH=null,HI=null,FV=false,SHOWD=false,PR={name:'',avatar:null};
const NAV=[['#/','🏠','Home'],['#/recepten','🍝','Recepten'],['#/maken','🛒','Boodschappen'],['#/spullen','🧺','Spullen'],['#/historie','📜','Historie']];
async function route(){if(window.REC)return;
  const {data:{session}}=await db.auth.getSession();user=session?.user;
  document.getElementById('top').style.display=user?'flex':'none';document.getElementById('nav').innerHTML=user?NAV.map(n=>`<a href="${n[0]}" class="${(location.hash||'#/')==n[0]?'on':''}"><b>${n[1]}</b>${n[2]}</a>`).join(''):'';
  if(!user){HH=null;return login()}if(!HH&&!(await loadHH()))return joinScreen();
  const [p,a,b]=(location.hash||'#/').slice(2).split('/');
  try{await({'':home,recepten:recipes,recept:()=>detail(a),bewerk:()=>edit(a),maken:()=>make(a),lijst:()=>list(a),historie:history,instellingen:settings,spullen}[p]||home)()}catch(e){app.innerHTML=`<h1>Er ging iets mis</h1><p>${esc(e.message)}</p>`}
}
function login(){app.innerHTML=`<h1>Mijn boodschappen</h1><label>E-mail</label><input id=e type=email><label>Wachtwoord (min. 6 tekens)</label><input id=w type=password><p><button id=li>Inloggen</button> <button class=s id=su>Account maken</button></p><p><button class=s id=fp>Wachtwoord vergeten</button></p><p id=m></p>`;
 const f=k=>async()=>{const r=await db.auth[k]({email:e.value,password:w.value});m.textContent=r.error?r.error.message:(k=='signUp'&&!r.data.session?'Bevestig je e-mail en log daarna in.':'')};li.onclick=f('signInWithPassword');su.onclick=f('signUp');fp.onclick=async()=>{if(!e.value)return m.textContent='Vul eerst je e-mailadres in.';const r=await db.auth.resetPasswordForEmail(e.value,{redirectTo:location.origin+location.pathname});m.textContent=r.error?r.error.message:'Als dit adres bekend is, is er een mail verstuurd.'}}
async function home(){await names();const [r,l]=await Promise.all([db.from('recipes').select('*').order('created_at',{ascending:false}).limit(4),db.from('lists').select('*').order('created_at',{ascending:false}).limit(3)]);
 app.innerHTML=`<h1>Welkom${PR.name?' '+esc(PR.name):''}</h1>${PR.name?'':'<p><a href="#/instellingen">Vul je naam in via ⚙ Instellingen</a></p>'}<div class=bar><a class=btn href="#/bewerk/nieuw">➕ Recept toevoegen</a><a class="btn s" href="#/maken">🛒 Boodschappenlijst maken</a><a class="btn s" href="#/recepten">🍝 Recepten</a><a class="btn s" href="#/historie">📜 Historie</a></div><h2>Recente recepten</h2><div class=grid>${r.data.map(card).join('')||'<p>Nog geen recepten. Voeg je eerste toe.</p>'}</div><h2>Laatste boodschappenlijsten</h2>${l.data.map(hrow).join('')||'<p>Nog geen lijsten.</p>'}`}
const card=r=>`<div class=card><a href="#/recept/${r.id}" style="color:inherit;text-decoration:none"><div class=ph style="background-image:url('${photo(r.photo)}')">${r.photo?'':'🍽️'}</div><div class=t><b>${esc(r.name)}</b><br><small>${esc(r.category)||'–'} · ${r.servings} pers.</small>${(window.NM||{})[r.created_by]?'<br><small>door '+esc(NM[r.created_by])+'</small>':''}</div></a><button class=fav onclick="fav('${r.id}',${!FAVS.has(r.id)})">${FAVS.has(r.id)?'♥':'♡'}</button></div>`;
const hrow=l=>`<a class="card hist" href="#/lijst/${l.id}"><b>${dt(l.created_at)}</b> <small>${l.user_id==user.id?'(jij)':esc((window.NM||{})[l.user_id]||'')}</small><br><small>${l.recipes.map(r=>esc(r.name)+' ('+r.servings+')').join(', ')}</small></a>`;
async function fav(id,v){await(v?db.from('favorites').insert({recipe_id:id}):db.from('favorites').delete().eq('recipe_id',id));route()}
async function recipes(){FV=false;await names();const {data}=await db.from('recipes').select('*').order('name');window.ALL=data;
 const cats=[...new Set(data.map(r=>r.category).filter(Boolean))];
 app.innerHTML=`<h1>Recepten (${data.length})</h1><div class=bar><input id=q placeholder="Zoek op naam" oninput="draw()"><select id=c onchange="draw()"><option value="">Alle categorieën</option>${cats.map(c=>`<option value="${esc(c)}">${esc(c)} (${data.filter(r=>r.category==c).length})</option>`).join('')}</select><select id=u onchange="draw()"><option value="">Alle gebruikers</option>${[...new Set(data.map(r=>r.created_by).filter(Boolean))].map(i=>`<option value="${i}">${esc(NM[i]||'Onbekend')}</option>`).join('')}</select><button class=s onclick="FV=!FV;this.textContent=FV?'♥ Alleen favorieten':'♡ Favorieten';draw()">♡ Favorieten</button><a class=btn href="#/bewerk/nieuw">➕ Nieuw</a></div><div class=grid id=g></div>`;draw()}
function draw(){const q=norm(document.getElementById('q').value),c=document.getElementById('c').value,u=document.getElementById('u').value;document.getElementById('g').innerHTML=ALL.filter(r=>norm(r.name).includes(q)&&(!c||r.category==c)&&(!u||r.created_by==u)&&(!FV||FAVS.has(r.id))).map(card).join('')||'<p>Geen recepten gevonden.</p>'}
async function detail(id){await names();const {data:r}=await db.from('recipes').select('*').eq('id',id).single();let n=r.servings;
 const paint=()=>{app.innerHTML=`${r.photo?`<img class=hero src="${photo(r.photo)}">`:''}<h1>${esc(r.name)}</h1><p>${esc(r.description)}</p><p><small>${esc(r.category)} · Toegevoegd door ${esc((window.NM||{})[r.created_by]||'onbekend')}</small></p>
 <div class=stp><button onclick="S(-1)">−</button><b>${n} personen</b><button onclick="S(1)">+</button></div>
 <h2>Ingrediënten</h2><table>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${fmtO(i.qty*n/r.servings,i.unit)}</td></tr>`).join('')}</table>
 <h2>Bereiding</h2><ol class=steps>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
 <div class=bar><a class=btn href="#/bewerk/${id}">✏️ Bewerken</a><button class=s onclick="dup('${id}')">Dupliceren</button><button class=d onclick="del('${id}')">Verwijderen</button></div>`};
 window.S=d=>{n=Math.max(1,n+d);paint()};paint()}
async function dup(id){const {data:r}=await db.from('recipes').select('*').eq('id',id).single();delete r.id;delete r.created_at;delete r.updated_at;r.name+=' (kopie)';r.photo=null;const {data}=await db.from('recipes').insert(r).select().single();go('#/bewerk/'+data.id)}
async function del(id){if(!confirm('Dit recept verwijderen?'))return;const {data:r}=await db.from('recipes').select('photo').eq('id',id).single();if(r.photo)await db.storage.from('recipe-photos').remove([r.photo]);await db.from('recipes').delete().eq('id',id);go('#/recepten')}
async function edit(id){photoFile=null;R=id=='nieuw'?{name:'',description:'',photo:null,category:'',servings:2,ingredients:[{name:'',qty:'',unit:'gram'}],steps:['']}:(await db.from('recipes').select('*').eq('id',id).single()).data;form(id)}
function form(id){const cats=[...new Set((window.ALL||[]).map(r=>r.category).filter(Boolean))];
 app.innerHTML=`<h1>${id=='nieuw'?'Recept toevoegen':'Recept bewerken'}</h1>
 <label>Naam van het gerecht</label><input data-f=name value="${esc(R.name)}">
 <label>Omschrijving</label><textarea data-f=description rows=2>${esc(R.description)}</textarea>
 <label>Foto</label>${R.photo?`<img class=hero style="max-height:180px" src="${photo(R.photo)}"><br>`:''}${photoFile?'<small>Nieuwe foto gekozen</small><br>':''}
 <label class="btn s" style="display:inline-block;color:var(--ink)">📷 Foto toevoegen<input id=pf type=file accept="image/*" hidden></label> ${R.photo||photoFile?'<button class=s onclick="R.photo=null;photoFile=null;form(\''+id+'\')">Foto verwijderen</button>':''}
 <label>Categorie</label><input data-f=category list=cl value="${esc(R.category)}"><datalist id=cl>${cats.map(c=>`<option>${esc(c)}`).join('')}</datalist>
 <label>Aantal personen (standaard)</label><input data-f=servings type=number min=1 value="${R.servings}">
 <h2>Ingrediënten</h2>${R.ingredients.map((i,k)=>`<div class=row><input placeholder="Naam" data-i=${k} data-g=name value="${esc(i.name)}"><input class=n type=number step=any placeholder="Aantal" data-i=${k} data-g=qty value="${i.qty}"><select class=u data-i=${k} data-g=unit>${UNITS.map(u=>`<option ${u==i.unit?'selected':''}>${u}`).join('')}</select><button class="s x" onclick="R.ingredients.splice(${k},1);form('${id}')">✕</button></div>`).join('')}
 <button class=s onclick="add('i','${id}')">+ Ingrediënt toevoegen</button>
 <h2>Bereidingsstappen</h2>${R.steps.map((s,k)=>`<div class=row><b style="flex:0 0 24px">${k+1}.</b><textarea rows=2 data-s=${k}>${esc(s)}</textarea><button class="s x" onclick="mv(${k},-1,'${id}')">↑</button><button class="s x" onclick="mv(${k},1,'${id}')">↓</button><button class="s x" onclick="R.steps.splice(${k},1);form('${id}')">✕</button></div>`).join('')}
 <button class=s onclick="add('s','${id}')">+ Stap toevoegen</button>
 <p><button onclick="save('${id}')">Opslaan</button> <a class="btn s" href="#/recepten">Annuleren</a></p>`;
 app.oninput=e=>{const t=e.target.dataset;if(t.f)R[t.f]=t.f=='servings'?+e.target.value||1:e.target.value;if(t.g)R.ingredients[t.i][t.g]=e.target.value;if(t.s)R.steps[t.s]=e.target.value};
 app.onchange=e=>{if(e.target.dataset.g=='unit')R.ingredients[e.target.dataset.i].unit=e.target.value};
 app.onkeydown=e=>{const d=e.target.dataset;if(e.key!='Enter'||d.i===undefined||e.target.tagName=='SELECT')return;e.preventDefault();const k=+d.i;if(k==R.ingredients.length-1)add('i',id);else focusEl('[data-i="'+(k+1)+'"][data-g=name]')};
 document.getElementById('pf').onchange=e=>{photoFile=e.target.files[0];form(id)}}
function focusEl(q){const e=document.querySelector(q);if(e)e.focus()}
function add(kind,id){if(kind=='i'){R.ingredients.push({name:'',qty:'',unit:'gram'});form(id);focusEl('[data-i="'+(R.ingredients.length-1)+'"][data-g=name]')}else{R.steps.push('');form(id);focusEl('[data-s="'+(R.steps.length-1)+'"]')}}
function mv(k,d,id){const s=R.steps,j=k+d;if(j<0||j>=s.length)return;[s[k],s[j]]=[s[j],s[k]];form(id)}
const shrink=f=>new Promise(res=>{const im=new Image();im.onload=()=>{const m=1200,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.8)};im.src=URL.createObjectURL(f)});
async function save(id){if(!R.name.trim())return alert('Geef het recept een naam.');
 const old=id!='nieuw'?(await db.from('recipes').select('photo').eq('id',id).single()).data.photo:null;
 if(photoFile){R.photo=`${HH}/${Date.now()}.jpg`;const {error}=await db.storage.from('recipe-photos').upload(R.photo,await shrink(photoFile),{contentType:'image/jpeg'});if(error)return alert(error.message)}
 if(old&&old!=R.photo)await db.storage.from('recipe-photos').remove([old]);
 const row={name:R.name.trim(),description:R.description,photo:R.photo,category:R.category.trim(),servings:R.servings,ingredients:R.ingredients.filter(i=>i.name.trim()).map(i=>({name:i.name.trim(),qty:+i.qty||0,unit:i.unit})),steps:R.steps.filter(s=>s.trim())};
 const q=id=='nieuw'?db.from('recipes').insert(row).select().single():db.from('recipes').update(row).eq('id',id).select().single();
 const {data,error}=await q;if(error)return alert(error.message);go('#/recept/'+data.id)}
async function make(from){const {data}=await db.from('recipes').select('id,name,servings').order('name');let pre={};
 if(from){const l=(await db.from('lists').select('recipes').eq('id',from).single()).data;l.recipes.forEach(r=>pre[r.id]=r.servings)}
 app.innerHTML=`<h1>Boodschappenlijst maken</h1><input id=ms placeholder="Zoek een recept" oninput="fl()" style="margin-bottom:10px">${data.map(r=>`<div class="it mr" data-n="${esc(norm(r.name))}"><input type=checkbox data-r=${r.id} ${pre[r.id]?'checked':''}><span>${esc(r.name)}</span><input type=number min=1 style="width:70px" id="n${r.id}" value="${pre[r.id]||3}"> pers.</div>`).join('')||'<p>Voeg eerst recepten toe.</p>'}<p><button onclick="build(this)">Maak boodschappenlijst</button></p>`;
 window.RC=data;window.fl=()=>{const q=norm(ms.value);document.querySelectorAll('.mr').forEach(r=>r.style.display=r.dataset.n.includes(q)?'':'none')}}
async function build(bt){bt.disabled=true;bt.textContent='Bezig...';const reset=()=>{bt.disabled=false;bt.textContent='Maak boodschappenlijst'};const sel=RC.filter(r=>document.querySelector(`[data-r="${r.id}"]`).checked);
 const [{data:full},{data:am},{data:hb},{data:bs},{data:ro}]=await Promise.all([sel.length?db.from('recipes').select('*').in('id',sel.map(r=>r.id)):Promise.resolve({data:[]}),db.from('aisles').select('*'),db.from('herbs').select('*'),db.from('basics').select('*'),db.from('runout').select('*')]);
 const map=Object.fromEntries(am.map(a=>[a.name,a.aisle])),acc={},rec=[];
 full.forEach(r=>{const n=+document.getElementById('n'+r.id).value||r.servings;rec.push({id:r.id,name:r.name,servings:n});
  r.ingredients.forEach(i=>{const [b,m]=BASE[i.unit],k=norm(i.name),key=k+'|'+b;if(hb.some(h=>h.name&&k.includes(norm(h.name))))return;(acc[key]=acc[key]||{key,name:k,qty:0,base:b,aisle:aisleOf(k,map),done:false}).qty+=i.qty*m*n/r.servings})});
 [...bs,...ro].forEach(x=>{const k=norm(x.name);acc['x:'+k]={key:'x:'+k,name:k,qty:0,base:'x',x:1,txt:x.amount||'',photo:x.photo||null,aisle:aisleOf(k,map),done:false}});
 if(!Object.keys(acc).length){reset();return alert('Kies een recept, of zet iets bij Spullen.')}
 const {data,error}=await db.from('lists').insert({household_id:HH,recipes:rec,items:Object.values(acc)}).select().single();if(error){reset();return alert(error.message)}if(ro.length)await db.from('runout').delete().in('id',ro.map(x=>x.id));go('#/lijst/'+data.id)}
async function list(id){const {data:l}=await db.from('lists').select('*').eq('id',id).single();const own=l.user_id==user.id;
 const paint=()=>{const vis=i=>!i.done||SHOWD||(i.doneAt&&Date.now()-i.doneAt<5000),by=a=>l.items.filter(i=>i.aisle==a&&vis(i)).sort((x,y)=>x.done-y.done);
  app.innerHTML=`<h1>Boodschappen</h1><p>${dt(l.created_at)} · ${l.recipes.map(r=>esc(r.name)+' ('+r.servings+')').join(', ')}</p>`+[...new Set([...AIS,...l.items.map(i=>i.aisle)])].filter(a=>by(a).length).map(a=>`<h2>${esc(a)}</h2>`+by(a).map(i=>`<div class="it ${i.done?'done':''}"><input type=checkbox ${i.done?'checked':''} onchange="tick('${i.key}')">${i.photo?`<img src="${photo(i.photo)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`:''}<span>${amt(i)} ${esc(i.name)}</span><select class=noprint onchange="mvA('${i.key}',this.value)">${AIS.map(x=>`<option ${x==i.aisle?'selected':''}>${x}`)}</select></div>`).join('')).join('')+
  `<div class=bar><button onclick="print()">🖨️ Afdrukken / PDF</button><button class=s onclick="cp()">Kopiëren</button><button class=s onclick="sh()">Delen</button><button class=s onclick="csv()">CSV</button><a class="btn s" href="#/maken/${id}">Opnieuw gebruiken</a><button class=s onclick="tg()">Afgevinkt tonen (${l.items.filter(i=>i.done).length})</button>${own?'<button class=d onclick="dl()">Lijst verwijderen</button>':''}</div>`};
 const text=()=>l.items.map(i=>`${i.done?'[x]':'[ ]'} ${amt(i)} ${i.name}`).join('\n');
 const sv=()=>db.from('lists').update({items:l.items}).eq('id',id);
 window.tick=k=>{if(!own)return alert('Dit is de lijst van een huisgenoot. Kies Opnieuw gebruiken voor je eigen lijst.');const i=l.items.find(x=>x.key==k);i.done=!i.done;i.doneAt=i.done?Date.now():null;paint();sv();setTimeout(paint,5100)};
 window.mvA=async(k,a)=>{const i=l.items.find(x=>x.key==k);i.aisle=a;paint();await sv();await db.from('aisles').upsert({name:i.name,aisle:a})};
 SHOWD=false;window.tg=()=>{SHOWD=!SHOWD;paint()};window.dl=async()=>{if(!confirm('Deze lijst verwijderen?'))return;await db.from('lists').delete().eq('id',id);go('#/historie')};window.cp=()=>navigator.clipboard.writeText(text()).then(()=>alert('Gekopieerd'));
 window.sh=()=>navigator.share?navigator.share({title:'Boodschappen',text:text()}):cp();
 window.csv=()=>{const c='Aantal,Product,Categorie\n'+l.items.map(i=>[amt(i),i.name,i.aisle].map(v=>`"${v}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='boodschappen.csv';a.click()};paint()}
async function history(){await names();const {data}=await db.from('lists').select('*').order('created_at',{ascending:false});app.innerHTML=`<h1>Historie</h1>${data.map(hrow).join('')||'<p>Nog geen lijsten.</p>'}<h2>Huishouden</h2><p>${esc(HI.name)}. Code om iemand aan je huishouden toe te voegen (deelt alleen boodschappenlijsten): <b>${esc(HI.code)}</b></p><p><button class=s onclick="exportAll()">Alles exporteren (back-up)</button> <button class=s onclick="db.auth.signOut()">Uitloggen</button></p>`}
async function loadHH(){const {data}=await db.from('members').select('household_id,households(name,code)').eq('user_id',user.id);if(!data?.length)return false;HH=data[0].household_id;HI=data[0].households;const {data:p}=await db.from('profiles').select('name,avatar').eq('user_id',user.id);PR=p?.[0]||{name:'',avatar:null};return true}
function joinScreen(){app.innerHTML=`<h1>Huishouden</h1><p>Maak een huishouden aan, of sluit aan bij dat van iemand anders met een code.</p><label>Naam nieuw huishouden</label><input id=hn placeholder="Bijv. Thuis"><p><button id=hc>Huishouden maken</button></p><label>Of aansluiten met code</label><input id=hj><p><button class=s id=hb>Aansluiten</button></p><p id=hm></p>`;
 const run=async(f,a)=>{const {error}=await db.rpc(f,a);if(error)hm.textContent=error.message;else route()};
 hc.onclick=()=>run('create_household',{hname:hn.value||'Thuis'});hb.onclick=()=>run('join_household',{hcode:hj.value})}
async function exportAll(){const [r,l]=await Promise.all([db.from('recipes').select('*'),db.from('lists').select('*')]);
 const b64=async p=>{const {data}=await db.storage.from('recipe-photos').download(p);return new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(data)})};
 for(const x of r.data)if(x.photo)x.photo_data=await b64(x.photo);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),recipes:r.data,lists:l.data})],{type:'application/json'}));a.download='boodschappen-back-up.json';a.click()}
async function favs(){const {data}=await db.from('favorites').select('recipe_id');window.FAVS=new Set((data||[]).map(x=>x.recipe_id))}
async function names(){const {data}=await db.from('profiles').select('user_id,name');window.NM=Object.fromEntries((data||[]).map(p=>[p.user_id,p.name]));await favs()}
const av=p=>db.storage.from('avatars').getPublicUrl(p).data.publicUrl;
function settings(){let file=null;app.innerHTML=`<h1>Instellingen</h1><label>Je naam</label><input id=pn value="${esc(PR.name)}"><label>Foto</label>${PR.avatar?`<img src="${av(PR.avatar)}" style="width:96px;height:96px;border-radius:50%;object-fit:cover"><br>`:''}<label class="btn s" style="display:inline-block;color:var(--ink)">📷 Foto kiezen<input id=af type=file accept="image/*" hidden></label>${PR.avatar?' <button class=s id=ar>Foto verwijderen</button>':''}<p><button id=sv>Opslaan</button></p><p id=sg></p><p><small>Je e-mailadres is alleen voor jou zichtbaar: ${esc(user.email)}</small></p><h2>Account</h2><p><button class=s onclick="db.auth.signOut()">Uitloggen</button></p><p><button class=d id=dm>Mijn account verwijderen</button></p>`;
 af.onchange=e=>{file=e.target.files[0];sg.textContent='Foto gekozen. Klik op Opslaan.'};
 const ar=document.getElementById('ar');if(ar)ar.onclick=async()=>{await db.storage.from('avatars').remove([PR.avatar]);await db.from('profiles').upsert({user_id:user.id,name:PR.name,avatar:null});PR.avatar=null;settings()};
 sv.onclick=async()=>{let avatar=PR.avatar;if(file){const path=`${user.id}/${Date.now()}.jpg`;const {error}=await db.storage.from('avatars').upload(path,await shrink(file),{contentType:'image/jpeg'});if(error)return sg.textContent=error.message;if(avatar)await db.storage.from('avatars').remove([avatar]);avatar=path}
  const {error}=await db.from('profiles').upsert({user_id:user.id,name:pn.value.trim(),avatar});if(error)return sg.textContent=error.message;PR={name:pn.value.trim(),avatar};sg.textContent='Opgeslagen.'};
 dm.onclick=async()=>{if(!confirm('Je account en je boodschappenlijsten worden verwijderd. Recepten die je toevoegde blijven staan. Doorgaan?'))return;if(PR.avatar)await db.storage.from('avatars').remove([PR.avatar]);const {error}=await db.rpc('delete_me');if(error)return alert(error.message);await db.auth.signOut()}}
const amt=i=>i.x?(i.txt||''):fmtB(i.qty,i.base);
let TAB='op',OPF=null;
async function spullen(){const [op,ma,kr]=await Promise.all([db.from('runout').select('*').order('created_at'),db.from('basics').select('*').order('name'),db.from('herbs').select('*').order('name')]);
 const T=(k,t,n)=>`<button class="${TAB==k?'':'s'}" onclick="TAB='${k}';route()">${t} (${n})</button> `;
 const rows=(a,t,f)=>a.map(x=>`<div class=it>${x.photo?`<img src="${photo(x.photo)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`:''}<span>${esc(f(x))}</span><button class="s x" style="flex:0 0 44px;padding:0" onclick="rm('${t}','${x.id}')">✕</button></div>`).join('')||'<p><small>Nog niets.</small></p>';
 const form=(t,ph,extra)=>`<div class=row><input id=nn placeholder="${ph}">${extra}<button style="flex:0 0 auto" onclick="addItem('${t}')">Toevoegen</button></div>`;
 const body=TAB=='op'?`<p>Wat is er op? Het komt op je volgende boodschappenlijst en gaat daarna van deze lijst af.</p>`+form('runout','Bijv. hagelslag',`<label class="btn s" style="flex:0 0 auto;margin:0;color:var(--ink)"><span>📷</span><input type=file accept="image/*" hidden onchange="OPF=this.files[0];this.previousSibling.textContent='✓'"></label>`)+rows(op.data,'runout',x=>x.name)
 :TAB=='mandje'?`<p>Dit staat elke keer op je lijst.</p>`+form('basics','Bijv. melk',`<input id=na class=n placeholder="Aantal">`)+rows(ma.data,'basics',x=>(x.amount?x.amount+' ':'')+x.name)
 :`<p>Kruiden en dingen die je niet elke keer koopt. Ze komen nooit op je lijst, ook niet als een recept ze noemt.</p>`+form('herbs','Bijv. peper',``)+rows(kr.data,'herbs',x=>x.name);
 app.innerHTML=`<h1>Mijn spullen</h1><div class=bar>${T('op','Wat op is',op.data.length)}${T('mandje','Standaard mandje',ma.data.length)}${T('kruiden','Kruiden',kr.data.length)}</div>${body}`}
async function addItem(t){const n=document.getElementById('nn').value.trim();if(!n)return;const row={name:n};if(t=='basics')row.amount=document.getElementById('na').value.trim();
 if(t=='runout'&&OPF){const p=`${user.id}/op-${Date.now()}.jpg`,{error}=await db.storage.from('recipe-photos').upload(p,await shrink(OPF),{contentType:'image/jpeg'});if(error)return alert(error.message);row.photo=p}
 const {error}=await db.from(t).insert(row);if(error)return alert(error.message);OPF=null;route()}
async function rm(t,id){await db.from(t).delete().eq('id',id);route()}
function help(){const d=document.createElement('div');d.id='hp';d.style.cssText='position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px';
 d.innerHTML=`<div class=card style="max-width:520px;max-height:85vh;overflow:auto;padding:18px"><h2 style="margin-top:0">Hoe werkt het?</h2><p>🍝 <b>Recepten:</b> zoek, filter en open recepten. Met ♡ bewaar je favorieten. Stel op een recept het aantal personen in; de hoeveelheden rekenen mee. Voeg zelf recepten toe met ➕ Nieuw.</p><p>🛒 <b>Boodschappen:</b> zoek en kies recepten en het aantal personen (standaard 3). De app maakt één lijst en telt gelijke ingrediënten op. Vink af in de winkel; een product verdwijnt na enkele seconden.</p><p>🧺 <b>Spullen:</b> zet bij <i>Wat op is</i> wat er op is (met foto), bij <i>Standaard mandje</i> wat je altijd koopt, en bij <i>Kruiden</i> wat nooit op je lijst hoeft.</p><p>📜 <b>Historie:</b> al je lijsten en die van je huisgenoten. Je kunt een lijst opnieuw gebruiken of je eigen lijst verwijderen. Daar vind je ook de huishoudcode en een back-up.</p><p>⚙ <b>Instellingen:</b> je naam, foto en account. Alleen jij ziet je e-mailadres.</p><button onclick="document.getElementById('hp').remove()">Sluiten</button></div>`;document.body.appendChild(d)}
function newPw(){app.innerHTML=`<h1>Nieuw wachtwoord</h1><label>Nieuw wachtwoord (min. 6 tekens)</label><input id=pw type=password><p><button id=pb>Opslaan</button></p><p id=pm></p>`;pb.onclick=async()=>{const {error}=await db.auth.updateUser({password:pw.value});pm.textContent=error?error.message:'Wachtwoord gewijzigd.';if(!error)setTimeout(()=>{window.REC=0;go('#/');route()},1200)}}
addEventListener('hashchange',route);let lastUid;db.auth.onAuthStateChange((ev,se)=>{if(ev=='PASSWORD_RECOVERY'){window.REC=1;return setTimeout(newPw,0)}const u=se?.user?.id||null;if(u!==lastUid){lastUid=u;setTimeout(route,0)}});route();
</script></body></html>
